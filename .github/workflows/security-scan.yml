name: Security & Code Quality Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Fast Secret Scanning across entire repository
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Frontend Build & Dependency Vulnerability Scan (Trivy)
  frontend-scan:
    name: Frontend Quality & Dependency Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Scan Frontend Dependencies (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Frontend SARIF to Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'

  # 3. .NET Build & Sonar SAST Scan
  backend-and-sonar:
    name: .NET Build & Sonar Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history needed for Git blame in Sonar

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (Required for SonarScanner)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Run SonarQube / SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # Optional: omit or leave empty if using SonarCloud
        run: |
          # Build Sonar host url argument only if SONAR_HOST_URL secret is provided
          HOST_URL_ARG=""
          if [ -n "$SONAR_HOST_URL" ]; then
            HOST_URL_ARG="/d:sonar.host.url=${SONAR_HOST_URL}"
          fi

          dotnet-sonarscanner begin \
            /k:"it-tools" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            $HOST_URL_ARG \
            /d:sonar.sources="backend,frontend/src" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,**/.next/**"

          dotnet build backend/IT-Tools.sln --configuration Release

          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # 4. Docker & Compose Configuration Scan
  docker-scan:
    name: Docker Configuration & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Scan Dockerfiles and Compose Configurations (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Docker SARIF to Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-docker-results.sarif'
